name: Daily Dev Log

on:
  schedule:
    - cron: "47 13 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate daily entry
        run: python3 scripts/generate.py

      - name: Commit changes
        run: |
          git config user.name "Ayush-Iyer1611"
          git config user.email "Ayush-Iyer1611@users.noreply.github.com"

          git add daily-log.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "docs: daily CS knowledge entry"
          git push